name: Build Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: 의존성 설치
        run: flutter pub get
      - name: Android APK 빌드
        run: flutter build apk --debug
      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
